# Deploy on Render: render.com → New → Blueprint → pick this repository.
services:
  - type: web
    name: prahari
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      (python scripts/fetch_data.py || echo "datasets unavailable: the home tab will use simulated band data") &&
      python -c "from prahari.models.estimator import shared_inverse; shared_inverse()" &&
      (python -c "from prahari.data.wearables import load_fitbit_users; load_fitbit_users()" || echo "no band data")
    startCommand: python run.py --no-browser --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
